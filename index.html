<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Arbre Généalogique</title>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4ecd8; }
        #arbre-svg { width: 100%; height: 100vh; display: block; }
        
        /* Styles pour l'interface ajoutée */
        .ui-panel { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; font-family: sans-serif; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .reset-btn { position: absolute; bottom: 20px; right: 20px; padding: 10px 20px; cursor: pointer; background: #5d4037; color: white; border: none; border-radius: 5px; font-family: sans-serif; }
        .footer { position: absolute; bottom: 10px; left: 15px; font-family: sans-serif; font-size: 12px; color: #5d4037; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h1 style="margin: 0; font-size: 20px;">Arbre Généalogique</h1>
        <p style="margin: 5px 0 0; font-size: 14px;">Molette pour zoomer • Cliquer-glisser pour naviguer</p>
    </div>

    <object id="arbre-svg" data="arbre.svg" type="image/svg+xml"></object>

    <button class="reset-btn" onclick="svgPanZoom('#arbre-svg').reset()">Revoir tout l'arbre</button>

    <footer class="footer">Projet réalisé avec Adobe Illustrator & SVG | 2026</footer>

    <script>
        window.onload = function() {
            // Initialisation du zoom
            svgPanZoom('#arbre-svg', {
                zoomEnabled: true,
                controlIconsEnabled: true,
                fit: true,
                center: true
            });
        };
    </script>
</body>
</html>
